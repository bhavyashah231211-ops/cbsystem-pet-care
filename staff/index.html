<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBSystem Pet Care</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--bg2:#12121a;--card:#1e1e2e;--card2:#252538;--bd:#2a2a40;--ac:#2dd4a0;--or:#ff8a3d;--red:#ff4560;--blue:#4a9eff;--tx:#f0f0f8;--tx2:#9090b0}
:root[data-theme=light]{--bg:#f4f5fa;--bg2:#fff;--card:#fff;--card2:#eef0f7;--bd:#d9dcea;--tx:#161625;--tx2:#5a5d78}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f4f5fa;--bg2:#fff;--card:#fff;--card2:#eef0f7;--bd:#d9dcea;--tx:#161625;--tx2:#5a5d78}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px 'DM Sans',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,.bb{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:2px;font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
.scr{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;overflow:auto;z-index:5}
.logo{font-size:3.6rem;line-height:1}.logo b{color:var(--ac);font-weight:400}
.sub{color:var(--tx2);font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%;max-width:640px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px 12px;text-align:center;cursor:pointer;transition:.15s}
.st:hover{border-color:var(--ac);transform:translateY(-2px)}.st i{font-style:normal;font-size:2rem;display:block}
.st .bb{font-size:1.3rem;margin-top:4px}.st small{color:var(--tx2);font-size:.65rem}
.btn{background:var(--card2);border:1px solid var(--bd);border-radius:9px;padding:8px 13px;cursor:pointer}
.btn:hover{border-color:var(--ac)}.pri{background:var(--ac);color:#06281d;border-color:var(--ac);font-weight:700}
.dng{color:var(--red)}.sm{padding:4px 9px;font-size:.78rem}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}.pad button{height:56px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-size:1.2rem;cursor:pointer}
.dots{display:flex;gap:10px;height:16px}.dots span{width:13px;height:13px;border-radius:50%;border:2px solid var(--ac)}.dots .on{background:var(--ac)}
#app{position:fixed;inset:0;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--bd)}
.top .bb{font-size:1.5rem}.top .bb b{color:var(--ac);font-weight:400}.sp{flex:1}
nav{display:flex;gap:4px;padding:6px 10px;background:var(--bg2);overflow-x:auto;border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;background:none;border:0;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--tx2)}
nav button.on{background:var(--card2);color:var(--ac);font-weight:700}
main{flex:1;overflow:auto;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px}
.card h3{font-size:.72rem;color:var(--tx2);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.big{font-family:'Bebas Neue',Impact,sans-serif;font-size:2rem;color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;min-width:520px}th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--bd);font-size:.85rem}
th{color:var(--tx2);font-size:.7rem;text-transform:uppercase;letter-spacing:1px}tr:last-child td{border:0}
.tag{padding:2px 8px;border-radius:99px;font-size:.7rem;background:var(--card2)}.g{color:var(--ac)}.o{color:var(--or)}.r{color:var(--red)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
label{display:block;font-size:.72rem;color:var(--tx2);margin:8px 0 3px}
.mod{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.mb{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.mb h2{font-size:1.5rem;margin-bottom:4px}
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:50;pointer-events:none}
.toast{background:var(--ac);color:#06281d;padding:9px 16px;border-radius:10px;font-weight:700}
.bar{display:flex;align-items:flex-end;gap:8px;height:120px}.bar div{flex:1;background:var(--ac);border-radius:5px 5px 0 0;position:relative;min-height:2px}
.bar span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:.62rem;color:var(--tx2)}
.slots{display:flex;flex-wrap:wrap;gap:6px}.slots .btn.on{background:var(--ac);color:#06281d}.slots .btn[disabled]{opacity:.3}
@media(max-width:600px){.logo{font-size:2.8rem}}
</style></head><body>
<div id="toasts"></div>
<div class="scr" id="ss"></div>
<div id="app"><div class="top"><div class="bb" id="tl"></div><div class="sp"></div><span class="sub" id="who"></span><button class="btn sm" onclick="theme()">◐</button><button class="btn sm" onclick="logout()">Logout</button></div><nav id="nav"></nav><main id="main"></main></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const iso=n=>{const d=new Date();d.setDate(d.getDate()+(n||0));return d.toISOString().slice(0,10)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='cbspet1';
const DB={d:null,
 load(){try{const s=localStorage.getItem(KEY);if(s)this.d=JSON.parse(s)}catch(e){}if(!this.d)this.d=seed();else if(this.d.set&&this.d.set.cloud&&this.d.set.cloud.b&&BIZ&&this.d.set.cloud.b!==BIZ)this.d=seed();this.d=mig(this.d)},
 save(){try{localStorage.setItem(KEY,JSON.stringify(this.d))}catch(e){}}};
function seed(){const c1=uid(),c2=uid(),s1=uid(),s2=uid(),s3=uid(),a1=uid();return{
 set:{name:'CBSystem',tag:'Care for every paw.',ac:'#2dd4a0',cur:'£'},
 staff:[{id:'u1',name:'Owner',role:'owner',pin:'1234'},{id:'u2',name:'Sam (Desk)',role:'desk',pin:'1111'},{id:'u3',name:'Priya (Groomer)',role:'care',pin:'2222'},{id:'u4',name:'Tom (Walker)',role:'care',pin:'3333'}],
 att:[],
 svc:[{id:s1,name:'Dog Grooming',price:35,mins:60,promo:0},{id:s2,name:'Dog Walking',price:15,mins:30,promo:10},{id:s3,name:'Boarding (per night)',price:28,mins:60,promo:0}],
 cust:[{id:c1,name:'Alice Brown',phone:'07700 900111',email:'alice@example.com',pet:'Biscuit',species:'Dog',breed:'Labrador',vacc:iso(12),notes:'Nervous around clippers'},{id:c2,name:'Mark Davies',phone:'07700 900222',email:'mark@example.com',pet:'Luna',species:'Cat',breed:'Siamese',vacc:iso(90),notes:'Prefers morning slots'}],
 appt:[{id:a1,cid:c1,sid:s1,uid:'u3',date:iso(0),time:'10:00',st:'booked'},{id:uid(),cid:c2,sid:s3,uid:'u4',date:iso(1),time:'09:00',st:'booked'}],
 inv:[],task:[{id:uid(),t:'Clean grooming station',uid:'u3',st:'todo'},{id:uid(),t:'Prepare kennel 3',uid:'u4',st:'doing'}],
 msg:[],rev:[{id:uid(),cid:c1,r:5,t:'Biscuit looked fantastic!',d:iso(-3)}],
 stock:[{id:uid(),n:'Dog shampoo (5L)',q:2,min:3,sup:'PetSupplyCo'},{id:uid(),n:'Treats (bulk)',q:12,min:5,sup:'PetSupplyCo'}],
 faq:['Thanks for your enquiry! We are open Mon–Sat, 9am–5pm.','Please bring your pet\'s vaccination record on the first visit.','To reschedule, reply with your preferred date and time.']}}
let D,ses=null,tab='';const S=()=>D.set;
const m=n=>S().cur+Number(n||0).toFixed(2);
const cn=id=>(D.cust.find(c=>c.id===id)||{name:'—'}).name,sn=id=>(D.svc.find(s=>s.id===id)||{name:'—'}).name,un=id=>(D.staff.find(s=>s.id===id)||{name:'—'}).name;
const price=s=>s.price*(1-(s.promo||0)/100);
function save(){DB.save();cloudPush();}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),2600)}
function theme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light'}
function brand(){document.documentElement.style.setProperty('--ac',S().ac);document.title=S().name+' Pet Care';
 const n=esc(S().name);$('#tl').innerHTML=n+' <b>PET</b>'}
/* ---- stations & login ---- */
const ST=[['desk','🐾','Front Desk','Customers · Bookings · Billing'],['care','✂️','Care Team','Tasks · Schedule · Stock'],['owner','👑','Owner','Reports · Settings · All'],['book','📲','Online Booking','Customer self-booking'],['portal','🐶','My Pets','Customer login']];
function connectScreen(){$('#app').style.display='none';const s=$('#ss');s.style.display='flex';s.innerHTML=`<div class="logo bb">Connect <b>PET</b></div><div class="card" style="width:100%;max-width:360px"><p class="sub">Enter the staff key you were given for <b>${esc(BIZ)}</b>.</p><label>Staff key</label><input id="ck2" autocomplete="off"><div class="row"><button class="btn pri" id="cg">Connect</button></div></div>`;
 $('#cg').onclick=async()=>{const key=$('#ck2').value.trim();if(!key)return;S().cloud={url:SAAS_URL,key,b:BIZ};let r;try{r=await cl('pull')}catch(e){r={s:0,j:{}}}
  if(r.s===200&&r.j.data){adopt(r.j.data,r.j.ts);cloudInit();stations()}else{S().cloud={url:SAAS_URL,key:'',b:BIZ};toast(r.j.error==='suspended'?'This account is suspended. Contact support.':'Wrong key or business id')}}}
function stations(){if(BIZ&&!(S().cloud||{}).key)return connectScreen();window._pk=null;ses=null;$('#app').style.display='none';const s=$('#ss');s.style.display='flex';
 s.innerHTML=`<div class="logo bb">${esc(S().name)}<b> PET</b></div><div class="sub">${esc(S().tag)}</div><div class="grid">${ST.map(x=>`<div class="st" onclick="pick('${x[0]}')"><i>${x[1]}</i><div class="bb">${x[2]}</div><small>${x[3]}</small></div>`).join('')}</div><div class="sub">Local Mode · v1.0</div>`}
function pick(r){if(r==='book')return booking();if(r==='portal')return portalLogin();const l=D.staff.filter(u=>u.role===r||(r==='desk'&&u.role==='owner')&&false||u.role===r);
 $('#ss').innerHTML=`<h2>Who's working?</h2><div class="row">${l.map(u=>`<button class="btn" onclick="pin('${u.id}')">${esc(u.name)}</button>`).join('')||'<span class="sub">No staff for this station</span>'}</div><button class="btn sm" onclick="stations()">← Back</button>`}
let pv='';
function pin(id){pv='';const press=k=>{if(k==='⌫')pv=pv.slice(0,-1);else if(k!=='✓')pv+=k;if(pv.length>=4||k==='✓'){const u=D.staff.find(x=>x.id===id);if(u&&u.pin===pv){login(u);return}toast('Wrong PIN');pv=''}draw()};
 const draw=()=>{$('#ss').innerHTML=`<h2>${esc(un(id))}</h2><div class="dots">${[0,1,2,3].map(i=>`<span class="${i<pv.length?'on':''}"></span>`).join('')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div><div class="sub">You can also type the PIN on your keyboard</div><button class="btn sm" onclick="stations()">← Back</button>`;
 document.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>press(b.dataset.k))};window._pk=press;try{window.focus();document.activeElement&&document.activeElement.blur()}catch(e){}draw()}
window.addEventListener('keydown',e=>{if(!window._pk)return;const k=e.key;if(/^\d$/.test(k)||k==='Backspace'||k==='Enter'){e.preventDefault();window._pk(k==='Backspace'?'⌫':k==='Enter'?'✓':k)}},true);
const TABS={owner:['dash','cust','appt','svc','bill','task','msg','rev','stock','ana','help','set'],desk:['dash','cust','appt','svc','bill','msg','rev','help'],care:['appt','task','stock','help']};
const LBL={dash:'📊 Dashboard',cust:'👥 Customers',appt:'📅 Appointments',svc:'🏷️ Services',bill:'🧾 Billing',task:'✅ Tasks & Staff',msg:'💬 Messages',rev:'⭐ Reviews',stock:'📦 Inventory',ana:'📈 Analytics',help:'📚 Resources',set:'⚙️ Settings'};
function login(u){window._pk=null;ses=u;$('#ss').style.display='none';$('#app').style.display='flex';$('#who').textContent=u.name;brand();const t=TABS[u.role];
 $('#nav').innerHTML=t.map(k=>`<button id="n-${k}" onclick="go('${k}')">${LBL[k]}</button>`).join('');go(t[0])}
function logout(){ses=null;stations()}
function go(k){tab=k;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id==='n-'+k));render()}
function render(){if(!ses)return;$('#main').innerHTML=V[tab]();}
/* ---- modal + form helpers ---- */
function modal(h){const e=document.createElement('div');e.className='mod';e.innerHTML=`<div class="mb">${h}</div>`;e.onclick=ev=>{if(ev.target===e)e.remove()};document.body.appendChild(e);return e}
function closeM(){document.querySelectorAll('.mod').forEach(e=>e.remove())}
function form(title,fields,val,cb){const e=modal(`<h2>${title}</h2>${fields.map(f=>{const v=val[f[0]]==null?'':val[f[0]];let i;
 if(f[2]==='select')i=`<select name="${f[0]}">${f[3].map(o=>`<option value="${esc(o[0])}" ${o[0]==v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
 else if(f[2]==='textarea')i=`<textarea name="${f[0]}" rows="3">${esc(v)}</textarea>`;
 else i=`<input name="${f[0]}" type="${f[2]||'text'}" value="${esc(v)}">`;return`<label>${f[1]}</label>${i}`}).join('')}<div class="row" style="margin-top:14px"><button class="btn pri" id="fs">Save</button><button class="btn" onclick="closeM()">Cancel</button></div>`);
 e.querySelector('#fs').onclick=()=>{const o={};e.querySelectorAll('[name]').forEach(x=>o[x.name]=x.type==='number'?Number(x.value):x.value);e.remove();cb(o)}}
function upsert(key,id,o){if(id){Object.assign(D[key].find(x=>x.id===id),o)}else D[key].push(Object.assign({id:uid()},o));save();render()}
function del(key,id){if(!confirm('Delete this record?'))return;D[key]=D[key].filter(x=>x.id!==id);save();closeM();render()}
const T=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')||`<tr><td colspan="${h.length}" class="sub">Nothing here yet</td></tr>`}</table></div>`;
/* ---- business logic ---- */
function hrs(){const a=+(S().open??9),b=+(S().close??17),o=[];for(let h=a;h<b;h++)o.push(String(h).padStart(2,'0')+':00');return o}
function slotsFor(date,sid,skip){const sv=D.svc.find(x=>x.id===sid),cap=Math.max(1,+(sv&&sv.cap)||1);return hrs().map(t=>{const n=D.appt.filter(a=>a.id!==skip&&a.sid===sid&&a.date===date&&a.time===t&&a.st!=='cancelled').length;return[t,n<cap,cap-n]})}
function remind(cid,text){const c=D.cust.find(x=>x.id===cid)||{},h=S().hooks||{};D.msg.push({id:uid(),cid,dir:'out',text,d:iso(0),ch:'SMS/Email'});save();
 if(!h.sms&&!h.email)return toast('Logged (no SMS/email hook set in Settings)');
 hook('sms',{to:c.phone,text});hook('email',{to:c.email,subject:S().name,text});toast('Sent via your SMS/email hooks')}
function complete(id){const a=D.appt.find(x=>x.id===id),s=D.svc.find(x=>x.id===a.sid);a.st='done';D.inv.push({id:uid(),cid:a.cid,aid:id,amt:price(s),st:'unpaid',d:iso(0),desc:s.name});save();toast('Completed — invoice created');render()}
function resched(id){const a=D.appt.find(x=>x.id===id);form('Reschedule',[['date','Date','date'],['time','Time','select',hrs().map(t=>[t,t])]],a,o=>{if(!slotsFor(o.date,a.sid,id).find(s=>s[0]===o.time&&s[1]))return toast('That slot is full');upsert('appt',id,o);toast('Rescheduled');})}
function cancelA(id){if(confirm('Cancel this appointment?')){D.appt.find(x=>x.id===id).st='cancelled';save();render()}}
function pay(id){form('Take payment',[['method','Method','select',[['Card','Credit/debit card'],['PayPal','PayPal'],['Cash','Cash']]]],{},async o=>{const i=D.inv.find(x=>x.id===id);
 if(o.method!=='Cash'&&(S().hooks||{}).pay){toast('Contacting payment provider…');const c=D.cust.find(x=>x.id===i.cid)||{};
  const r=await hook('pay',{invoiceId:id,amount:i.amt,currency:S().cur,method:o.method,customer:c.name,email:c.email,description:i.desc});
  if(!r)return toast('Payment hook failed — not marked paid');
  if(r.ok===false||r.paid===false)return toast('Payment not completed');
  if(r.url){window.open(r.url,'_blank');if(!confirm('Checkout opened. Mark as paid once the customer has paid?'))return}}else if(o.method!=='Cash'&&payLink(i)){window.open(payLink(i),'_blank');if(!confirm('Payment page opened. Mark as paid once the customer has paid?'))return}
 i.st='paid';i.method=o.method;save();toast('Payment recorded');render()})}
function reqFb(cid){D.msg.push({id:uid(),cid,dir:'out',text:'How was your visit? Please leave us a quick review!',d:iso(0),ch:'SMS/Email'});save();toast('Feedback request queued')}
/* ---- views ---- */
const V={
dash(){const td=D.appt.filter(a=>a.date===iso(0)&&a.st==='booked'),paid=D.inv.filter(i=>i.st==='paid').reduce((s,i)=>s+i.amt,0),out=D.inv.filter(i=>i.st==='unpaid').reduce((s,i)=>s+i.amt,0),avg=D.rev.length?(D.rev.reduce((s,r)=>s+r.r,0)/D.rev.length).toFixed(1):'—';
 const vac=D.cust.filter(c=>c.vacc&&c.vacc<=iso(30)),low=D.stock.filter(s=>s.q<=s.min);
 return`<div class="cards"><div class="card"><h3>Today</h3><div class="big">${td.length}</div></div><div class="card"><h3>Revenue</h3><div class="big">${m(paid)}</div></div><div class="card"><h3>Outstanding</h3><div class="big o">${m(out)}</div></div><div class="card"><h3>Avg rating</h3><div class="big">${avg}</div></div></div>
 <h2>Today's appointments</h2>${T(['Time','Customer','Service','Staff'],td.map(a=>`<tr><td>${a.time}</td><td>${esc(cn(a.cid))}</td><td>${esc(sn(a.sid))}</td><td>${esc(un(a.uid))}</td></tr>`))}
 <h2>Vaccinations due (30 days)</h2>${T(['Pet','Owner','Due',''],vac.map(c=>`<tr><td>${esc(c.pet)}</td><td>${esc(c.name)}</td><td class="${c.vacc<iso(0)?'r':'o'}">${c.vacc}</td><td><button class="btn sm" onclick="remind('${c.id}','Reminder: ${esc(c.pet)}\\'s vaccination is due on ${c.vacc}.')">Remind</button></td></tr>`))}
 <h2>Low stock</h2>${T(['Item','Qty','Min'],low.map(s=>`<tr><td>${esc(s.n)}</td><td class="r">${s.q}</td><td>${s.min}</td></tr>`))}`},
cust(){const q=(window._q||'').toLowerCase();const l=D.cust.filter(c=>(c.name+c.pet+c.email).toLowerCase().includes(q));
 return`<div class="row"><input style="max-width:260px" placeholder="Search owner or pet…" value="${esc(window._q||'')}" oninput="window._q=this.value;render();this.focus()"><button class="btn pri" onclick="editC()">+ Customer</button></div>`+T(['Owner','Contact','Pet','Vaccination due',''],l.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}<br><span class="sub">${esc(c.email)}</span></td><td>${esc(c.pet)} <span class="tag">${esc(c.species)}</span></td><td>${c.vacc||'—'}</td><td><button class="btn sm" onclick="profile('${c.id}')">Open</button></td></tr>`))},

/* ---- customer portal ---- */
function portalLogin(){$('#ss').innerHTML=`<h2>My Pets</h2><div class="card" style="width:100%;max-width:340px"><label>Email</label><input id="pe" type="email"><label>Portal code (4 digits)</label><input id="pc" type="password" inputmode="numeric" maxlength="4"><div class="row" style="margin-top:12px"><button class="btn pri" id="pg">Sign in</button><button class="btn" onclick="stations()">← Back</button></div></div><div class="sub">Your code is in your booking confirmation, or ask the front desk.</div>`;
 $('#pg').onclick=()=>{const e=$('#pe').value.trim().toLowerCase(),c=D.cust.find(x=>x.email&&x.email.toLowerCase()===e&&x.code===$('#pc').value);c?portal(c.id):toast('Email or code not recognised')}}
function portal(cid){const c=D.cust.find(x=>x.id===cid),ap=D.appt.filter(a=>a.cid===cid).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)),iv=D.inv.filter(i=>i.cid===cid),owed=iv.filter(i=>i.st==='unpaid').reduce((t,i)=>t+i.amt,0);
 $('#ss').innerHTML=`<div class="bb" style="font-size:2rem">Hi ${esc(c.name.split(' ')[0])} 🐾</div><div style="width:100%;max-width:560px;text-align:left"><div class="card"><h3>My pet</h3><div class="bb" style="font-size:1.5rem">${esc(c.pet)}</div>${esc(c.species)} · ${esc(c.breed||'—')}<br>Vaccination due: <b class="${c.vacc&&c.vacc<iso(30)?'o':''}">${c.vacc||'—'}</b></div>
 <h2 style="margin-top:12px">Appointments</h2>${T(['When','Service','Status',''],ap.map(a=>`<tr><td>${a.date} ${a.time}</td><td>${esc(sn(a.sid))}</td><td><span class="tag">${a.st}</span></td><td>${a.st==='booked'?`<button class="btn sm" onclick="pMove('${a.id}','${cid}')">Move</button> <button class="btn sm dng" onclick="pCancel('${a.id}','${cid}')">Cancel</button>`:''}</td></tr>`))}
 <h2>Invoices ${owed?'<span class="o">· owing '+m(owed)+'</span>':''}</h2>${T(['Date','Item','Amount','Status'],iv.map(i=>`<tr><td>${i.d}</td><td>${esc(i.desc)}</td><td>${m(i.amt)}</td><td><span class="tag ${i.st==='paid'?'g':'o'}">${i.st}</span></td></tr>`))}
 <div class="row"><button class="btn pri" onclick="booking()">+ Book a visit</button><button class="btn" onclick="pRev('${cid}')">Leave a review</button><button class="btn" onclick="pMsg('${cid}')">Message us</button><button class="btn" onclick="stations()">Sign out</button></div></div>`}
function pMove(id,cid){const a=D.appt.find(x=>x.id===id);form('Move appointment',[['date','Date','date'],['time','Time','select',hrs().map(t=>[t,t])]],a,o=>{if(!slotsFor(o.date,a.sid,a.id).find(x=>x[0]===o.time&&x[1]))return toast('That slot is full');Object.assign(a,o);save();toast('Moved');portal(cid)})}
function pCancel(id,cid){if(confirm('Cancel this appointment?')){D.appt.find(x=>x.id===id).st='cancelled';save();portal(cid)}}
function pRev(cid){form('Leave a review',[['r','Rating (1–5)','number'],['t','Comment','textarea']],{r:5},o=>{o.r=Math.min(5,Math.max(1,o.r||5));D.rev.push({id:uid(),cid,r:o.r,t:o.t,d:iso(0)});save();toast('Thank you!');portal(cid)})}
function pMsg(cid){form('Message us',[['text','Your message','textarea']],{},o=>{if(!o.text)return;D.msg.push({id:uid(),cid,dir:'in',text:o.text,d:iso(0),ch:'Portal'});save();toast('Sent');portal(cid)})}

/* ---- invoices & payment links ---- */
function payLink(i){const x=S(),c=({'£':'GBP','$':'USD','€':'EUR'})[x.cur]||'GBP';return x.pp?'https://paypal.me/'+encodeURIComponent(x.pp)+'/'+Number(i.amt).toFixed(2)+c:(x.plink||'')}
function invText(i){const c=D.cust.find(x=>x.id===i.cid)||{},l=payLink(i);return 'Invoice from '+S().name+'\n'+(c.name||'')+' - '+i.desc+' ('+i.d+')\nAmount: '+m(i.amt)+' ('+i.st+')'+(i.st==='unpaid'&&l?'\nPay online: '+l:'')}
function sendInv(id){const i=D.inv.find(x=>x.id===id);modal(`<h2>Send invoice</h2><pre style="white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:8px;margin:8px 0">${esc(invText(i))}</pre><div class="row"><button class="btn pri" onclick="sendVia('email','${id}')">Email app</button><button class="btn" onclick="sendVia('sms','${id}')">SMS app</button><button class="btn" onclick="sendVia('hooks','${id}')">Via hooks</button><button class="btn" onclick="closeM()">Close</button></div>`)}
function sendVia(how,id){const i=D.inv.find(x=>x.id===id),c=D.cust.find(x=>x.id===i.cid)||{},t=invText(i);D.msg.push({id:uid(),cid:c.id,dir:'out',text:t.replace(/\n/g,' | '),d:iso(0),ch:how});save();closeM();
 if(how==='email')location.href='mailto:'+(c.email||'')+'?subject='+encodeURIComponent('Invoice from '+S().name)+'&body='+encodeURIComponent(t);
 else if(how==='sms')location.href='sms:'+(c.phone||'')+'?&body='+encodeURIComponent(t);
 else{hook('sms',{to:c.phone,text:t});hook('email',{to:c.email,subject:'Invoice from '+S().name,text:t});toast('Sent via your hooks')}}
function saveHrs(){const a=+$('#ho').value,b=+$('#hc').value;if(!(a>=0&&b<=24&&b>a))return toast('Closing hour must be after opening');S().open=a;S().close=b;save();toast('Saved')}
function savePay(){S().pp=$('#pp').value.trim().replace(/^.*paypal\.me\//i,'');S().plink=$('#pl').value.trim();save();toast('Saved')}
/* ---- auto backup to a chosen folder (Chrome/Edge) ---- */
let bkH=null,bkT=0;
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('cbspet',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=no})}
async function idbGet(k){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch(e){return null}}
async function idbSet(k,v){try{const d=await idb();d.transaction('k','readwrite').objectStore('k').put(v,k)}catch(e){}}
async function bkInit(){bkH=await idbGet('dir');clearInterval(bkT);if(!bkH)return;bkT=setInterval(()=>bkRun(true),72e6/10);let last=0;try{last=+localStorage.getItem('cbspet_bk')||0}catch(e){}if(Date.now()-last>72e5)bkRun(true);if(ses&&tab==='set')render()}
async function bkPick(){if(!window.showDirectoryPicker)return toast('Folder backup needs Chrome or Edge on a computer');try{bkH=await window.showDirectoryPicker({mode:'readwrite'});await idbSet('dir',bkH);await bkInit();await bkRun();render()}catch(e){}}
async function bkRun(auto){if(!bkH)return toast('Choose a backup folder first');try{let p=await bkH.queryPermission({mode:'readwrite'});if(p!=='granted'){if(auto)return;p=await bkH.requestPermission({mode:'readwrite'})}if(p!=='granted')return toast('Folder permission denied');
 if(auto){let last=0;try{last=+localStorage.getItem('cbspet_bk')||0}catch(e){}if(Date.now()-last<72e5)return}
 const n='cbsystem-pet-backup-'+new Date().toISOString().slice(0,16).replace(/[-:T]/g,'').replace(/^(\d{8})/,'$1-')+'.json',q=JSON.parse(JSON.stringify(D));q.set.cloud={url:'',key:''};
 const f=await bkH.getFileHandle(n,{create:true}),w=await f.createWritable();await w.write(JSON.stringify(q,null,1));await w.close();try{localStorage.setItem('cbspet_bk',String(Date.now()))}catch(e){}if(!auto)toast('Backup saved: '+n)}catch(e){toast('Backup failed')}}
DB.load();D=DB.d;
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{D=DB.d=JSON.parse(e.newValue);render()}catch(x){}}});
brand();stations();cloudInit();bkInit();
</script></body></html>
